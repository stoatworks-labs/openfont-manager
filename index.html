<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFont Manager</title>
    <meta
      name="description"
      content="Browse, preview and bulk-download open-source fonts from Google Fonts and Fontsource, or hand it a CSV/XML list. The desktop app installs them for you, at login, from a folder or a network share."
    />
    <link rel="canonical" href="https://openfont-manager.stoatworks-labs.com/" />
    <meta property="og:title" content="OpenFont Manager" />
    <meta property="og:url" content="https://openfont-manager.stoatworks-labs.com/" />
    <!-- Card hosted on the main site: regenerated in place by the website's
         make_thumbnails.py and keeps its filename. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/openfont-manager.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/openfont-manager.png" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
